name: echo_player
description: "Echo Player - Modern Offline Audio Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Audio Playback
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.1.18

  # File Picker
  file_picker: ^8.1.3

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/photos/
    - assets/sounds/